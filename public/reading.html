<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타로 리딩</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d1740'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23d4af37'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-0: #0b0820;
      --bg-1: #14102e;
      --bg-2: #1d1740;
      --accent: #d4af37;
      --accent-soft: #f2d97a;
      --violet: #8a5cff;
      --text: #f0ebff;
      --muted: #a89dc8;
      --card-bg: #1a1438;
      --border: rgba(212, 175, 55, 0.25);
      --good: #7dd8a0;
      --warn: #e8a06a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(ellipse at top, #2a1a5e 0%, var(--bg-0) 45%),
        radial-gradient(ellipse at bottom, #3d1a4a 0%, var(--bg-0) 50%);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(1px 1px at 60% 70%, white, transparent),
        radial-gradient(1px 1px at 80% 20%, white, transparent),
        radial-gradient(2px 2px at 30% 80%, white, transparent),
        radial-gradient(1px 1px at 90% 50%, white, transparent);
      background-size: 250px 250px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 1.5rem 0 1rem;
    }
    header h1 {
      font-size: 1.6rem;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 60%, var(--violet) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }

    .step {
      margin-top: 1.75rem;
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .step.active { opacity: 1; pointer-events: auto; }
    .step.done { opacity: 0.8; pointer-events: auto; }

    .step-label {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .step-label .no {
      font-size: 0.72rem;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.1rem 0.55rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .step-label h2 { font-size: 1.05rem; font-weight: 600; }
    .step-label .hint { font-size: 0.8rem; color: var(--muted); }

    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(26, 20, 56, 0.55);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
    .chip.selected {
      background: linear-gradient(135deg, var(--accent), #b8941f);
      color: #1a0f00;
      border-color: transparent;
      font-weight: 700;
    }

    /* Shuffle */
    .shuffle-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      padding: 1.2rem 0 0.4rem;
    }
    .shuffle-deck {
      width: 110px;
      height: 176px;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .shuffle-deck .s-card {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      border: 1.5px solid var(--accent);
      background: radial-gradient(circle at center, var(--violet) 0%, var(--bg-2) 72%);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 2.2rem;
      transition: transform 0.28s ease;
    }
    .shuffle-deck .s-card:nth-child(1) { transform: rotate(-6deg) translateX(-8px); }
    .shuffle-deck .s-card:nth-child(2) { transform: rotate(3deg) translateX(6px); }
    .shuffle-deck .s-card:nth-child(3) { transform: rotate(0deg); }
    .shuffle-deck.shaking .s-card:nth-child(1) { transform: rotate(-14deg) translate(-20px, -6px); }
    .shuffle-deck.shaking .s-card:nth-child(2) { transform: rotate(11deg) translate(18px, -3px); }
    .shuffle-deck.shaking .s-card:nth-child(3) { transform: rotate(-2deg) translateY(-10px); }
    .kick-note { font-size: 0.82rem; color: var(--muted); text-align: center; }
    .kick-count { color: var(--accent-soft); font-variant-numeric: tabular-nums; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #b8941f); color: #1a0f00; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35); }
    .btn-primary:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
    .btn-ghost { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: rgba(212, 175, 55, 0.12); }

    /* Slots */
    .slots {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 0.6rem 0 1.2rem;
    }
    .slot {
      width: 96px;
      text-align: center;
    }
    .slot .frame {
      width: 96px;
      height: 154px;
      border: 1.5px dashed rgba(212, 175, 55, 0.4);
      border-radius: 10px;
      background: rgba(26, 20, 56, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.78rem;
      overflow: hidden;
      transition: border-color 0.3s ease;
    }
    .slot.next .frame { border-color: var(--accent); box-shadow: 0 0 14px rgba(212, 175, 55, 0.25); }
    .slot.filled .frame { border-style: solid; }
    .slot .frame img { width: 100%; height: 100%; object-fit: cover; }
    .slot .frame img.reversed { transform: rotate(180deg); }
    .slot .slot-name { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }
    .slot .slot-card { font-size: 0.8rem; color: var(--accent-soft); min-height: 1.2em; }

    /* Fan deck */
    .fan-wrap {
      position: relative;
      overflow-x: auto;
      padding: 1.4rem 1rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(20, 16, 46, 0.55);
      scrollbar-width: thin;
    }
    .fan {
      display: flex;
      height: 132px;
      padding-left: 26px;
      width: max-content;
    }
    .fan .f-card {
      width: 74px;
      height: 118px;
      margin-left: -52px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background:
        radial-gradient(circle at 50% 42%, rgba(138, 92, 255, 0.75) 0%, var(--bg-2) 75%);
      box-shadow: -3px 4px 10px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: transform 0.16s ease, opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(242, 217, 122, 0.85);
      font-size: 1.1rem;
      -webkit-tap-highlight-color: transparent;
    }
    .fan .f-card:hover { transform: translateY(-14px); z-index: 5; }
    .fan .f-card.taken { opacity: 0; pointer-events: none; }

    /* Results */
    .result-card {
      display: grid;
      grid-template-columns: 132px 1fr;
      gap: 1.1rem;
      background: rgba(26, 20, 56, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem;
      margin-bottom: 1rem;
      animation: rise 0.5s ease;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .result-card .art {
      width: 132px;
      height: 212px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5);
    }
    .result-card .art img { width: 100%; height: 100%; object-fit: cover; }
    .result-card .art img.reversed { transform: rotate(180deg); }
    .r-pos {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .r-name { font-size: 1.2rem; font-weight: 700; margin: 0.1rem 0 0.3rem; }
    .r-name small { font-weight: 400; color: var(--muted); font-size: 0.8rem; margin-left: 0.4rem; }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.12rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.55rem;
    }
    .badge.upright { background: rgba(125, 216, 160, 0.15); color: var(--good); border: 1px solid rgba(125, 216, 160, 0.4); }
    .badge.reversed { background: rgba(232, 160, 106, 0.13); color: var(--warn); border: 1px solid rgba(232, 160, 106, 0.4); }
    .kw { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.6rem; }
    .kw span {
      font-size: 0.74rem;
      color: var(--muted);
      border: 1px solid rgba(168, 157, 200, 0.35);
      border-radius: 999px;
      padding: 0.06rem 0.55rem;
    }
    .r-theme { font-size: 0.95rem; margin-bottom: 0.5rem; }
    .r-theme b { color: var(--accent-soft); font-weight: 600; }
    .r-general { font-size: 0.86rem; color: var(--muted); }
    .r-general summary { cursor: pointer; color: var(--text); font-size: 0.82rem; margin-bottom: 0.3rem; }

    .finish { text-align: center; margin-top: 1.4rem; }

    @media (max-width: 560px) {
      .result-card { grid-template-columns: 96px 1fr; }
      .result-card .art { width: 96px; height: 154px; }
      .slots { gap: 0.6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>타로 리딩</h1>
      <p>마음속 질문 하나를 떠올리고 시작해 보세요</p>
    </header>

    <section class="step active" id="stepTheme">
      <div class="step-label"><span class="no">STEP 1</span><h2>테마 선택</h2><span class="hint">어떤 이야기가 궁금한가요?</span></div>
      <div class="chips" id="themeChips"></div>
    </section>

    <section class="step" id="stepSpread">
      <div class="step-label"><span class="no">STEP 2</span><h2>뽑기 방식</h2></div>
      <div class="chips" id="spreadChips"></div>
    </section>

    <section class="step" id="stepShuffle">
      <div class="step-label"><span class="no">STEP 3</span><h2>카드 섞기</h2><span class="hint">덱을 눌러 기운을 불어넣으세요</span></div>
      <div class="shuffle-zone">
        <div class="shuffle-deck" id="shuffleDeck">
          <div class="s-card"></div>
          <div class="s-card"></div>
          <div class="s-card">✦</div>
        </div>
        <div class="kick-note">덱을 누른 횟수와 리듬이 섞임에 반영됩니다 · <span class="kick-count" id="kickCount">0</span>회</div>
        <button class="btn btn-primary" id="shuffleDone">섞기 완료</button>
      </div>
    </section>

    <section class="step" id="stepPick">
      <div class="step-label"><span class="no">STEP 4</span><h2>카드 뽑기</h2><span class="hint" id="pickHint"></span></div>
      <div class="slots" id="slots"></div>
      <div class="fan-wrap"><div class="fan" id="fan"></div></div>
    </section>

    <section class="step" id="stepResult">
      <div class="step-label"><span class="no">STEP 5</span><h2>리딩 결과</h2></div>
      <div id="results"></div>
      <div class="finish"><button class="btn btn-ghost" id="restart">↻ 새 리딩 시작</button></div>
    </section>
  </div>

  <script>
    // All server interaction goes through `api` so a standalone build can
    // swap in a mock implementation.
    const api = window.__mockApi || {
      meta: () => fetch("/readings/meta").then((r) => r.json()),
      create: (body) =>
        fetch("/readings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then((r) => r.json()),
      draw: (id, deckIndex) =>
        fetch(`/readings/${id}/draw`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deckIndex }),
        }).then((r) => r.json()),
      img: (path) => path,
    };

    const $ = (id) => document.getElementById(id);
    const state = { theme: null, spread: null, kickTaps: [], readingId: null, positions: [], draws: [] };

    const setStep = (id, mode) => {
      const el = $(id);
      el.classList.remove("active", "done");
      if (mode) el.classList.add(mode);
    };

    async function init() {
      const meta = await api.meta();
      for (const t of meta.themes) {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = t.label.ko;
        b.addEventListener("click", () => {
          state.theme = t.key;
          [...$("themeChips").children].forEach((c) => c.classList.toggle("selected", c === b));
          setStep("stepTheme", "done");
          setStep("stepSpread", "active");
          $("stepSpread").scrollIntoView({ behavior: "smooth", block: "center" });
        });
        $("themeChips").appendChild(b);
      }
      for (const s of meta.spreads) {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = s.label.ko;
        b.addEventListener("click", () => {
          state.spread = s.key;
          state.positions = s.positions;
          [...$("spreadChips").children].forEach((c) => c.classList.toggle("selected", c === b));
          setStep("stepSpread", "done");
          setStep("stepShuffle", "active");
          $("stepShuffle").scrollIntoView({ behavior: "smooth", block: "center" });
        });
        $("spreadChips").appendChild(b);
      }
    }

    // STEP 3 — kick: tap count + rhythm feed the shuffle seed.
    $("shuffleDeck").addEventListener("click", () => {
      state.kickTaps.push(Date.now());
      $("kickCount").textContent = state.kickTaps.length;
      const deck = $("shuffleDeck");
      deck.classList.add("shaking");
      setTimeout(() => deck.classList.remove("shaking"), 240);
    });

    $("shuffleDone").addEventListener("click", async () => {
      $("shuffleDone").disabled = true;
      const taps = state.kickTaps;
      const kick = {
        tapCount: taps.length,
        rhythm: taps.slice(1).map((t, i) => t - taps[i]),
        finishedAt: Date.now(),
      };
      const reading = await api.create({ theme: state.theme, spread: state.spread, kick });
      state.readingId = reading.readingId;
      buildSlots();
      buildFan();
      setStep("stepShuffle", "done");
      setStep("stepPick", "active");
      $("pickHint").textContent = `마음이 가는 카드 ${state.positions.length}장을 골라 주세요`;
      $("stepPick").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    function buildSlots() {
      $("slots").innerHTML = "";
      for (const p of state.positions) {
        const d = document.createElement("div");
        d.className = "slot";
        d.dataset.key = p.key;
        d.innerHTML = `<div class="frame">${p.label.ko}</div><div class="slot-name">${p.label.ko}</div><div class="slot-card"></div>`;
        $("slots").appendChild(d);
      }
      markNextSlot();
    }

    function markNextSlot() {
      const slots = [...$("slots").children];
      slots.forEach((s) => s.classList.remove("next"));
      const next = slots.find((s) => !s.classList.contains("filled"));
      if (next) next.classList.add("next");
    }

    function buildFan() {
      $("fan").innerHTML = "";
      for (let i = 0; i < 78; i++) {
        const c = document.createElement("div");
        c.className = "f-card";
        c.dataset.index = i;
        c.addEventListener("click", () => pick(c, i));
        $("fan").appendChild(c);
      }
    }

    let picking = false;
    async function pick(el, deckIndex) {
      if (picking || el.classList.contains("taken")) return;
      picking = true;
      const result = await api.draw(state.readingId, deckIndex);
      picking = false;
      if (result.error) return;

      el.classList.add("taken");
      state.draws.push(result);

      const slot = $("slots").querySelector(`[data-key="${result.position.key}"]`);
      const rev = result.interpretation.orientation === "reversed";
      slot.classList.add("filled");
      slot.querySelector(".frame").innerHTML =
        `<img src="${api.img(result.card.image)}" alt="${result.card.name.ko}" class="${rev ? "reversed" : ""}" />`;
      slot.querySelector(".slot-card").textContent = result.card.name.ko;
      markNextSlot();
      renderResult(result);

      if (result.complete) {
        setStep("stepPick", "done");
        setStep("stepResult", "active");
        $("stepResult").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function renderResult(r) {
      const rev = r.interpretation.orientation === "reversed";
      const themed = r.interpretation.theme;
      const div = document.createElement("div");
      div.className = "result-card";
      div.innerHTML = `
        <div class="art"><img src="${api.img(r.card.image)}" alt="${r.card.name.ko}" class="${rev ? "reversed" : ""}" /></div>
        <div>
          <div class="r-pos">${r.position.label.ko}</div>
          <div class="r-name">${r.card.name.ko}<small>${r.card.name.en}</small></div>
          <span class="badge ${rev ? "reversed" : "upright"}">${rev ? "역방향" : "정방향"}</span>
          <div class="kw">${r.interpretation.keywords.map((k) => `<span>${k}</span>`).join("")}</div>
          ${themed && themed.ko ? `<p class="r-theme"><b>${themeLabelKo()}</b> · ${themed.ko}</p>` : ""}
          <details class="r-general"><summary>종합 해석 보기</summary><p>${r.interpretation.general.ko}</p></details>
        </div>`;
      $("results").appendChild(div);
      setStep("stepResult", "active");
    }

    function themeLabelKo() {
      const chip = $("themeChips").querySelector(".selected");
      return chip ? chip.textContent : "";
    }

    $("restart").addEventListener("click", () => location.reload());

    init();
  </script>
</body>
</html>
